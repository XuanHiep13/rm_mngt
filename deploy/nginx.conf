events { worker_connections 2048; }
http {
  # $uri intentionally excludes the query string and its one-time connection ticket.
  log_format sanitized '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
  access_log /var/log/nginx/access.log sanitized;
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;
    location / {
      proxy_pass http://app:3000;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering off;
    }
    location = /healthz { return 404; }
    location = /readyz { return 404; }
  }
}
